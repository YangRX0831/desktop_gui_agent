# 非 GUI 自动化质量检查。
# 项目生产代码面向 Windows，并直接使用 Windows ctypes API，因此测试和类型
# 检查均在 Windows runner 上执行。真实 GUI 任务仍不在 CI 中运行。
name: ci

on:
  push:
  pull_request:

jobs:
  tests-and-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test-time dependencies
        run: >
          python -m pip install --upgrade pip &&
          python -m pip install pytest "agentscope>=1.0,<2" "mcp>=1.13,<2" mss pillow numpy opencv-python
      - name: pytest tests/
        run: python -B -m pytest tests -q -p no:cacheprovider
      - name: benchmark self-tests
        run: python -B -m pytest benchmark -q -p no:cacheprovider
      - name: black
        run: python -m pip install black && python -m black --check agent perception control utils tools main.py config.py verify_env.py tests benchmark
      - name: isort
        run: python -m pip install isort && python -m isort --check-only --profile black agent perception control utils tools main.py config.py verify_env.py tests benchmark
      - name: flake8
        run: python -m pip install flake8 && python -m flake8 --max-line-length=88 --extend-ignore=E203,W503 agent perception control utils tools main.py config.py verify_env.py tests benchmark

  mypy-production:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install mypy
        run: python -m pip install --upgrade pip && python -m pip install mypy
      - name: production mypy
        run: >
          python -m mypy --ignore-missing-imports
          config.py main.py verify_env.py agent perception control utils
